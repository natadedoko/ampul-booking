.ltime{font-weight:700;font-size:15px}
.lmain b{display:block}
.lmain small{display:block;color:var(--ink-2);font-size:12px;line-height:1.45}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.panel{margin:12px 14px 24px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 16px 18px;max-width:720px}

.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.srow input,.srow select{min-height:40px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:16px}
.srow input.wide{flex:1 1 160px;min-width:0}
.srow input.num{width:110px}
.wrap{margin:0 14px 24px;max-width:760px}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}

.shiftwrap{margin:0 14px 8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:auto}
.sgrid{display:grid;grid-template-columns:96px repeat(7,minmax(88px,1fr));min-width:calc(96px + 7 * 88px)}

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

var DAY = ['日','月','火','水','木','金','土'];
function windowHint(d){
  var t = today();
  if(d.windowUntil){
    if(d.windowUntil < t) return '<b>この日付は、もう過ぎています。</b>お客さん用ページで、予約できる日がありません。';
    var n = Math.round((parseYmd(d.windowUntil) - parseYmd(t))/86400000);
    return 'お客さんは、<b>'+jpDate(d.windowUntil)+'</b>まで予約できます（今日から'+n+'日分）。この日付は、自動では進みません。'+(n>365?'　※1年より先は、表示されません。':'');
  }
  return 'お客さんは、今日から'+d.windowDays+'日先（'+jpDate(addDays(t, d.windowDays))+'）まで予約できます。毎日、自動で1日ずつ進みます。';
}
var CANCEL_OPTS = [[-1,'ネットでは受け付けない'],[0,'当日まで'],[1,'前日まで'],[2,'2日前まで'],[3,'3日前まで'],[4,'4日前まで'],[5,'5日前まで'],[6,'6日前まで'],[7,'7日前（1週間前）まで'],[10,'10日前まで'],[14,'14日前（2週間前）まで'],[21,'21日前（3週間前）まで'],[30,'30日前まで']];
var STATUS = {
  booked:{label:'予約中',cls:'st-book'},
  visited:{label:'来店済み',cls:'st-visit'},
  paid:{label:'会計済み',cls:'st-paid'},
  canceled:{label:'キャンセル',cls:'st-cancel'}
};
var GENDER = {'':'未設定', f:'女性', m:'男性', o:'その他'};

  if(!Array.isArray(s.menus) || !s.menus.length) s.menus = d.menus;
  s.open = Number(s.open); s.close = Number(s.close);
  if(!isFinite(s.open) || !isFinite(s.close) || s.close <= s.open){ s.open = d.open; s.close = d.close; }

  s.windowDays = isFinite(Number(s.windowDays)) ? Number(s.windowDays) : d.windowDays;
  s.windowUntil = /^\d{4}-\d{2}-\d{2}/.test(String(s.windowUntil||'')) ? String(s.windowUntil).slice(0,10) : '';
  s.stepMin = isFinite(Number(s.stepMin)) ? Number(s.stepMin) : d.stepMin;

function patternOf(st){
  var s = state.settings, base = defaultPattern(s.open, s.close), p = (st && st.pattern) || {}, out = {};
  for(var i=0;i<7;i++){
    var x = p[i];
    out[i] = x ? {on:!!x.on, start:x.start||base[i].start, end:x.end||base[i].end} : base[i];
  }
  return out;
}
function overrideFor(staffId, date){
  var items = state.shifts[date.slice(0,7)] || {};
  var it = items[date+'_'+staffId];
  return (it && typeof it==='object') ? it : null;
}
function closureOn(date){ return state.closures.filter(function(c){return c.day===date;})[0] || null; }
function shiftFor(staffId, date){
  var s = state.settings, cl = closureOn(date);
  if(cl) return {on:false, start:toTime(s.open*60), end:toTime(s.close*60), custom:false, closed:true, note:cl.note||'臨時休業'};
  var ov = overrideFor(staffId, date);
  if(ov){
    return {on:!!ov.on, start:ov.start||toTime(s.open*60), end:ov.end||toTime(s.close*60), custom:true};
  }
  var dow = parseYmd(date).getDay();
  if((s.closedWeekdays||[]).indexOf(dow)>=0) return {on:false, start:toTime(s.open*60), end:toTime(s.close*60), custom:false, closed:true, note:'定休日'};
  var p = patternOf(staffById(staffId))[dow];
  return {on:!!p.on, start:p.start, end:p.end, custom:false};
}

async function fetchAll(table, build){
  var out = [], from = 0, size = 1000;
  for(;;){
    var q = sb.from(table).select('*');
    if(build) q = build(q);
    var r = await q.range(from, from+size-1);
    if(r.error) throw r.error;
    out = out.concat(r.data || []);
    if(!r.data || r.data.length<size) break;
    from += size;
  }
  return out;
}

function upsertRsv(r){

    state.blocks = state.blocks.filter(function(r){return r.id!==id;});

function scheduleReload(t){
  clearTimeout(reloadTimers[t]);
  reloadTimers[t] = setTimeout(async function(){
    try{
      if(t==='customers' || t==='visits') await loadCustomers();
      else if(t==='shift_overrides') await loadOverrides();
      else if(t==='closures') await loadClosures();
      else if(t==='intakes') await loadIntakes();
      else await loadSettings();
      render();
    }catch(_){}
  }, 400);
}
function startRealtime(){
  stopRealtime();
  try{
    channel = sb.channel('vh-db').on('postgres_changes', {event:'*', schema:'public'}, function(p){
      if(p.table==='reservations') onRsvEvent(p); else scheduleReload(p.table);
    }).subscribe();
  }catch(_){ channel = null; }
  pollTimer = setInterval(async function(){
    if(state.auth!=='in') return;
    try{ await Promise.all([loadReservations(), loadOverrides()]); render(); }catch(_){}
  }, 60000);
}
function stopRealtime(){

  clearInterval(pollTimer);
}

function ledgerView(){
  var s = state.settings, d = state.date;
  var all = state.rows.filter(function(r){return r.date===d;});
  var rows = all.filter(function(r){return r.status!=='canceled';});
  var bks = state.blocks.filter(function(b){return b.date===d;});
  var gs = s.open*60, ge = s.close*60;
  rows.concat(bks).forEach(function(r){
    var a = toMin(r.start), b = a+(Number(r.dur)||0);
    gs = Math.min(gs, Math.floor(a/60)*60);
    ge = Math.max(ge, Math.ceil(b/60)*60);
  });
  state.gs = gs;
  var staff = s.staff.slice();
  if(rows.concat(bks).some(function(r){return !staff.some(function(x){return x.id===r.staffId;});})){
    staff.push({id:'__unknown', name:'担当者不明'});
  }
  var H = (ge-gs)*PXM;
  var isToday = d===today(), nm = nowMin();
  var nowLine = (isToday && nm>=gs && nm<=ge) ? '<i class="now" style="top:'+((nm-gs)*PXM)+'px"></i>' : '';
  var labels = '';
  for(var m=gs;m<ge;m+=60){
    labels += '<span class="tl" style="top:'+(((m-gs)*PXM)+2)+'px">'+(m/60)+':00</span>';
    if(m+30<ge) labels += '<span class="tl half" style="top:'+(((m+30-gs)*PXM)+2)+'px">:30</span>';
  }
  function seg(a,b){
    if(b<=a) return '';
    return '<i class="offtime" style="top:'+((a-gs)*PXM)+'px;height:'+((b-a)*PXM)+'px"></i>';
  }
  var gridCss = 'background-size:100% '+(60*PXM)+'px,100% '+(30*PXM)+'px,6px 100%,100% '+snapPx()+'px;';
  var heads = '', cols = '';
  staff.forEach(function(st){
    var unknown = st.id==='__unknown';
    var sh = unknown ? null : shiftFor(st.id, d);
    var mine = rows.filter(function(r){
      return unknown ? !s.staff.some(function(x){return x.id===r.staffId;}) : r.staffId===st.id;
    });
    var mineB = bks.filter(function(b){
      return unknown ? !s.staff.some(function(x){return x.id===b.staffId;}) : b.staffId===st.id;
    });
    var off = '';
    if(sh){
      if(!sh.on) off = seg(gs, ge);
      else { off = seg(gs, Math.min(toMin(sh.start), ge)) + seg(Math.max(toMin(sh.end), gs), ge); }
    }
    heads += '<div class="hd">'+esc(st.name)+(sh?'<small>'+(sh.on?esc(sh.start)+'〜'+esc(sh.end):(sh.closed?'休業':'休み'))+'</small>':'')+'</div>';
    cols += '<div class="scol" data-staff="'+esc(st.id)+'" style="'+gridCss+'height:'+H+'px">'+off+mine.map(function(r){return blockHtml(r,gs);}).join('')+mineB.map(function(b){return blkHtml(b,gs);}).join('')+nowLine+'</div>';
  });

  var visited = all.filter(function(r){return r.status==='visited'||r.status==='paid';}).length;
  var sales = all.filter(function(r){return r.status==='paid';}).reduce(function(a,r){return a+Number(r.price||0);},0);
  var canceled = all.filter(function(r){return r.status==='canceled';}).length;
  var cnote = closedNote(d);

  return '<div class="bar">'+
    '<button class="btn icon" data-action="prev-day" aria-label="前の日">‹</button>'+
    '<label class="datebtn"><span>'+jpDate(d)+'</span><input type="date" id="datepick" value="'+d+'" aria-label="日付を選ぶ"></label>'+
    '<button class="btn icon" data-action="next-day" aria-label="次の日">›</button>'+
    '<button class="btn" data-action="today">今日</button>'+
    '<button class="btn" data-action="new-block">休憩など</button>'+
    '<button class="btn primary grow" data-action="new">予約を登録</button></div>'+
    weekStrip()+
    '<div class="stats"><div><span class="k">予約</span><b>'+rows.length+'件</b></div>'+
    '<div><span class="k">来店済み</span><b>'+visited+'件</b></div>'+
    '<div><span class="k">会計済みの売上</span><b>'+yen(sales)+'</b></div>'+
    (canceled?'<div><span class="k">キャンセル</span><b>'+canceled+'件</b></div>':'')+
'</div>'+
    (cnote?'<p class="hint"><b>この日は休業日です（'+esc(cnote)+'）。</b>お客さん用ページには、空き枠が出ません。</p>':'')+
    (rows.length===0?'<p class="hint">この日の予約はまだありません。空いている時間をタップすると登録できます。</p>':'<p class="hint">枠はドラッグで移動できます。空いているところをドラッグすると、休憩などで時間をうめられます（スマホは、長押ししてから動かします）。</p>')+
    '<div class="ledger-wrap"><div class="ledger-scroll"><div class="ledger" style="--cols:'+staff.length+'">'+
    '<div class="corner">時間</div>'+heads+
    '<div class="tcol" style="height:'+H+'px">'+labels+'</div>'+cols+
    '</div></div></div>';
}

function listRowsHtml(){
  var t = today();
  var q = norm(state.q);
  var rows = state.rows.slice();
  if(q) rows = rows.filter(function(r){
    return [r.name,r.phone,r.menu,r.note].some(function(v){return norm(v).indexOf(q)>=0;});
  });
  if(state.filter!=='all') rows = rows.filter(function(r){return r.status===state.filter;});
  var history = state.showPast || !!q;
  if(!history) rows = rows.filter(function(r){return r.date>=t;});
  rows.sort(function(a,b){
    if(a.date!==b.date){ var c = a.date<b.date?-1:1; return history?-c:c; }
    return toMin(a.start)-toMin(b.start);
  });
  if(!rows.length) return '<p class="hint">'+(q?'該当する予約が見つかりません。':'表示できる予約がありません。')+'</p>';

      cur = r.date;
      out += '<section class="dgroup"><h3>'+jpDate(cur)+(cur===t?'<span class="tag">今日</span>':'')+'</h3>';

}

  var days = []; for(var i=0;i<7;i++) days.push(addDays(sun,i));

  var ae = document.activeElement;

async function twoStepDelete(armLabel, fn){
  var btn = document.getElementById('f-del');
  if(!btn) return;
  if(!btn.classList.contains('armed')){
    btn.classList.add('armed'); btn.textContent = armLabel;
    modalCtx.delTimer = setTimeout(function(){
      var b = document.getElementById('f-del'); if(b){b.classList.remove('armed'); b.textContent='削除';}
    }, 4500);
    return;
  }
  btn.disabled = true;
  try{ await fn(); }
  catch(e){ btn.disabled = false; setErr(errMsg(e)); }
}

function suggestions(q){
  var nq = norm(q); if(!nq) return [];
  var qd = String(q).replace(/[^0-9]/g,'');
  var out = [], seen = {};
  function digits(v){return String(v||'').replace(/[^0-9]/g,'');}
  state.customers.slice().sort(byKana).forEach(function(c){
    seen[norm(c.name)+'|'+digits(c.phone)] = 1;
    if(norm(c.name).indexOf(nq)>=0 || norm(c.kana).indexOf(nq)>=0 || (qd.length>=3 && digits(c.phone).indexOf(qd)>=0)) out.push({t:'c', c:c});
  });
  state.rows.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;}).forEach(function(r){
    var key = norm(r.name)+'|'+digits(r.phone);
    if(seen[key]) return;
    if(norm(r.name).indexOf(nq)>=0 || (qd.length>=3 && digits(r.phone).indexOf(qd)>=0)){ seen[key] = 1; out.push({t:'r', r:r}); }
  });
  return out.slice(0,6);
}

/* お客さん用フォームのメッセージを読み取る */
function parseRequest(text){
  var keys = {'お名前':'name','フリガナ':'kana','電話番号':'phone','初めての方':'first','ご利用':'first','メニュー':'menu','第1希望':'p1','第2希望':'p2','第3希望':'p3','ご要望':'note'};
  var out = {}, cur = null;
  String(text||'').split(/\r?\n/).forEach(function(l){
    var m = l.match(/^\s*([^：:]+)[：:]\s*(.*)$/);
    if(m && keys[m[1].trim()]){ cur = keys[m[1].trim()]; out[cur] = m[2].trim(); }
    else if(cur==='note' && l.trim()){ out.note += '\n'+l.trim(); }
  });
  return out;
}
function parseWish(s){
  var d = String(s||'').match(/(\d{4})年(\d{1,2})月(\d{1,2})日/), t = String(s||'').match(/(\d{1,2}):(\d{2})/);
  if(!d) return null;
  return {date:d[1]+'-'+pad(Number(d[2]))+'-'+pad(Number(d[3])), start:t ? pad(Number(t[1]))+':'+t[2] : ''};
}
function applyRequest(){
  var r = parseRequest(val('f-paste'));
  var info = document.getElementById('f-info');
  if(!r.name && !r.p1){
    info.textContent = '読み取れる内容が見つかりませんでした。お客さんのフォームで作られたメッセージを、そのまま貼り付けてください。';
    return;
  }
  if(r.name) document.getElementById('f-name').value = r.name;
  if(r.phone) document.getElementById('f-phone').value = r.phone;
  document.getElementById('f-cust').value = ''; renderLink();
  var w = parseWish(r.p1), msg = '読み取りました。内容を確認して保存してください。';
  if(w){
    document.getElementById('f-date').value = w.date;
    if(w.start){
      var st = document.getElementById('f-start');
      if(!Array.prototype.some.call(st.options, function(o){return o.value===w.start;})){
        var o = document.createElement('option'); o.value = w.start; o.textContent = w.start; st.appendChild(o);
      }
      st.value = w.start;
    }
  } else { msg += '第1希望の日時は読み取れなかったので、手で選んでください。'; }

function readForm(){

  var ex = modalCtx.ex;
  var menuId, menuName;
  if(menuVal==='__old' && ex){ menuId = ex.menuId||''; menuName = ex.menu||''; }
  else { var m = s.menus.filter(function(x){return x.id===menuVal;})[0]; menuId = m?m.id:''; menuName = m?m.name:''; }
  var st = document.querySelector('input[name="f-status"]:checked');
  return {
    date:val('f-date'), start:val('f-start'), dur:Number(val('f-dur')),
    menuId:menuId, menu:menuName,

    name:val('f-name').trim(), phone:val('f-phone').trim(), note:val('f-note').trim(),
    status:st?st.value:'booked'
  };

function shiftWarning(f){
  if(f.status==='canceled') return '';
  var st = staffById(f.staffId);
  if(!st) return '';
  var sh = shiftFor(f.staffId, f.date);
  var a = toMin(f.start), b = a+f.dur;
  if(!sh.on) return sh.closed ? jpDate(f.date)+'は休業日（'+sh.note+'）の設定です。' : st.name+'は'+jpDate(f.date)+'が休みの設定です。';
  if(a<toMin(sh.start) || b>toMin(sh.end)) return st.name+'の勤務時間（'+sh.start+'〜'+sh.end+'）の外です。';
  return '';
}

async function submitForm(){
  var f = readForm();
  if(!f.name){ setErr('お名前を入力してください。'); document.getElementById('f-name').focus(); return; }
  if(!f.date){ setErr('日付を選んでください。'); return; }
  var a = toMin(f.start), b = a+f.dur;
  if(b>24*60){ setErr('終了時刻が24:00を過ぎています。開始時刻か所要時間を調整してください。'); return; }
  if(f.status!=='canceled'){
    var clash = state.rows.concat(state.blocks).filter(function(r){
      if(r.id===modalCtx.id || r.date!==f.date || r.staffId!==f.staffId || r.status==='canceled') return false;
      var ra = toMin(r.start), rb = ra+(Number(r.dur)||0);
      return a<rb && ra<b;
    })[0];
    if(clash){
      var ca = toMin(clash.start);
      setErr(staffName(f.staffId)+'は'+toTime(ca)+'〜'+toTime(ca+(Number(clash.dur)||0))+'に'+(clash.kind==='block' ? '「'+clash.name+'」の枠が' : clash.name+'様の予約が')+'あります。時間か担当を変えてください。');
      return;
    }
  }
  var w = shiftWarning(f);
  var sig = [f.date,f.start,f.dur,f.staffId].join('|');
  if(w && modalCtx.warned!==sig){
    modalCtx.warned = sig;
    setErr(w+'このまま登録する場合は、もう一度「保存」を押してください。');
    return;
  }
  var btn = document.getElementById('f-save');
  btn.disabled = true; setErr('');
  try{
    var customerId = '';
    var makeNew = !f.cust && f.newCust;
    if(makeNew) customerId = await createCustomer({name:f.name, phone:f.phone, kana:'', birth:'', gender:'', chief:'', history:'', memo:''});
    else if(f.cust) customerId = f.cust;
    var data = {
      date:f.date, start:f.start, dur:f.dur, menuId:f.menuId, menu:f.menu, price:f.price,
      staffId:f.staffId, customerId:customerId, name:f.name, phone:f.phone, note:f.note, status:f.status,
      createdAt:(modalCtx.ex && modalCtx.ex.createdAt) || Date.now(), updatedAt:Date.now()
    };
    await saveRow(modalCtx.id, data);
    if(state.view==='ledger' && state.date!==f.date){ state.date = f.date; state.needScroll = true; }
    closeForm(); render();
    toast(makeNew ? '予約とカルテを保存しました' : '予約を保存しました');
  }catch(e){
    btn.disabled = false; setErr(errMsg(e));
  }
}

var BLOCK_PRESETS = ['休憩','昼休み','打ち合わせ','準備・片付け','私用','研修'];
function blockFormHtml(v, isEdit, fromSel){

  var u = snapMin();
  var starts = range(s.open*60, s.close*60-u, u), ends = range(s.open*60+u, s.close*60, u);
  function num(a,b){return a-b;}

  var chips = BLOCK_PRESETS.map(function(t){return '<button type="button" class="chip" data-m="bpick" data-v="'+esc(t)+'">'+esc(t)+'</button>';}).join('');

  var body =
    '<div class="fld"><label for="f-btitle">内容</label><input id="f-btitle" type="text" autocomplete="off" maxlength="30" placeholder="例：休憩" value="'+esc(v.title)+'">'+
    '<div class="pills" style="margin-top:6px">'+chips+'</div></div>'+

    '<div class="fld"><label for="f-bend">終了</label><select id="f-bend">'+options(ends.map(function(m){return [toTime(m),toTime(m)];}),toTime(v.end))+'</select></div></div>'+

  return sheetHtml(isEdit ? '枠を編集' : '休憩などの枠をうめる', body, {del:isEdit,

function openBlockForm(opt){
  var s = state.settings;
  var ex = opt.id ? state.blocks.filter(function(x){return x.id===opt.id;})[0] : null;
  var st0 = (12*60>=s.open*60 && 13*60<=s.close*60) ? 12*60 : s.open*60;
  var v = ex ? {date:ex.date, staffId:ex.staffId, title:ex.name, start:toMin(ex.start), end:toMin(ex.start)+(Number(ex.dur)||60)}
             : {date:opt.date || state.date, staffId:(opt.staffId && opt.staffId!=='__unknown') ? opt.staffId : s.staff[0].id, title:'',
                start:(opt.start!=null ? opt.start : st0), end:(opt.end!=null ? opt.end : (opt.start!=null ? opt.start : st0)+60)};
  showModal({kind:'block', id:ex ? ex.id : null, ex:ex, fromSel:!!opt.fromSel}, blockFormHtml(v, !!ex, !!opt.fromSel), 'f-btitle');

async function submitBlock(){
  var f = {title:val('f-btitle').trim(), staffId:val('f-bstaff'), date:val('f-bdate'), start:val('f-bstart'), end:val('f-bend'),
           rep:val('f-brep')||'none', until:val('f-buntil')};
  if(!f.title){ setErr('内容を入力してください（例：休憩）。'); document.getElementById('f-btitle').focus(); return; }
  if(!f.date){ setErr('日付を選んでください。'); return; }
  var a = toMin(f.start), b = toMin(f.end), dur = b - a;
  if(dur<5){ setErr('終了は、開始より後の時刻にしてください。'); return; }
  var self = modalCtx.id, isNew = !self, dates = [f.date];
  if(isNew && f.rep!=='none'){
    if(!f.until){ setErr('「最後の日」を入力してください。'); return; }
    if(f.until<f.date){ setErr('「最後の日」は、日付と同じか、それより後の日にしてください。'); return; }
    if(f.until>addDays(f.date,92)){ setErr('くりかえせるのは、最長で3か月先までです。'); return; }
    dates = [];
    for(var d=f.date; d<=f.until; d=addDays(d, f.rep==='weekly' ? 7 : 1)) dates.push(d);
  }
  function clashOn(day){
    return state.rows.concat(state.blocks).filter(function(x){
      if(x.id===self || x.date!==day || x.staffId!==f.staffId || x.status==='canceled') return false;
      var xa = toMin(x.start), xb = xa + (Number(x.dur)||0);
      return a<xb && xa<b;
    })[0];
  }
  var todo = [], skipped = 0;
  dates.forEach(function(day){
    if(dates.length>1){
      var sh = shiftFor(f.staffId, day);
      if(sh && !sh.on){ skipped++; return; }
    }
    if(clashOn(day)){ skipped++; return; }
    todo.push(day);
  });
  if(dates.length===1 && skipped){
    var c = clashOn(f.date), ca = toMin(c.start);
    setErr(staffName(f.staffId)+'は'+toTime(ca)+'〜'+toTime(ca+(Number(c.dur)||0))+'に'+(c.kind==='block' ? '「'+c.name+'」の枠が' : c.name+'様の予約が')+'あります。時間か担当を変えてください。');
    return;
  }
  if(!todo.length){ setErr('入れられる日がありませんでした（すべて、担当の休みの日か、予約と重なっています）。'); return; }
  var btn = document.getElementById('f-save');
  btn.disabled = true; setErr('');
  try{
    var made = 0;
    if(!isNew){
      await saveBlock(self, {date:f.date, start:f.start, dur:dur, staffId:f.staffId, name:f.title});
      made = 1;
    } else {
      for(var i=0; i<todo.length; i+=6){
        var chunk = todo.slice(i, i+6);
        var res = await Promise.all(chunk.map(function(day){
          return saveBlock(null, {date:day, start:f.start, dur:dur, staffId:f.staffId, name:f.title}, true).then(
            function(){ return true; },
            function(e){ if(e && e.code==='23P01') return false; throw e; });
        }));
        res.forEach(function(ok){ if(ok) made++; else skipped++; });
      }
    }
    if(state.view==='ledger' && state.date!==f.date){ state.date = f.date; state.needScroll = true; }
    closeForm(); render();
    toast(dates.length>1 ? made+'件の枠を入れました'+(skipped ? '（'+skipped+'件は、休みか予約と重なるため、とばしました）' : '') : '枠を保存しました');
  }catch(e){
    btn.disabled = false; setErr(errMsg(e));
    render();
  }
}
async function deleteBlock(){
  await removeBlock(modalCtx.id);
  closeForm(); render(); toast('枠を削除しました');
}

function mdLabel(ds){ var d = parseYmd(ds); return (d.getMonth()+1)+'/'+d.getDate()+'（'+DAY[d.getDay()]+'）'; }
function closureGroups(){
  var list = state.closures.filter(function(c){return c.day>=today();}).sort(function(a,b){return a.day<b.day?-1:a.day>b.day?1:0;});
  var groups = [];
  list.forEach(function(c){
    var g = groups[groups.length-1];
    if(g && g.note===c.note && addDays(g.to,1)===c.day) g.to = c.day; else groups.push({from:c.day, to:c.day, note:c.note});
  });
  return groups;
}
function closureListHtml(){
  var gs = closureGroups();
  if(!gs.length) return '<p class="hint" style="padding:0 0 8px">これからの臨時休業は、ありません。</p>';
  return gs.map(function(g){
    return '<div class="srow"><span>'+esc(mdLabel(g.from))+(g.to!==g.from?'〜'+esc(mdLabel(g.to)):'')+'　'+esc(g.note||'臨時休業')+'</span>'+
      '<button class="btn" data-action="del-closure" data-from="'+g.from+'" data-to="'+g.to+'">解除</button></div>';
  }).join('');
}
async function addClosure(){
  var c = state.cl, from = c.from, to = c.to || c.from, note = String(c.note||'').trim() || '臨時休業';
  if(!from){ toast('最初の日を選んでください'); return; }
  if(to<from){ toast('最後の日は、最初の日と同じか、それより後にしてください'); return; }
  if(to>addDays(from,366)){ toast('一度に入れられるのは、1年分までです'); return; }
  var rows = [];
  for(var d=from; d<=to; d=addDays(d,1)) rows.push({day:d, note:note});
  try{
    need(await sb.from('closures').upsert(rows, {onConflict:'day'}));
    await loadClosures();
    state.cl = {from:'', to:'', note:''};
    var n = state.rows.filter(function(r){return r.date>=from && r.date<=to && r.status==='booked';}).length;
    render();
    toast(rows.length+'日分を、休業日にしました'+(n ? '（すでに予約が'+n+'件入っています。ご連絡をお忘れなく）' : ''));
  }catch(e){ toast(errMsg(e)); }
}
async function removeClosure(from, to){
  try{
    need(await sb.from('closures').delete().gte('day',from).lte('day',to));
    await loadClosures(); render(); toast('休業日を解除しました');
  }catch(e){ toast(errMsg(e)); }
}

/* ---------- backup ---------- */
function downloadText(name, mime, text){
  var blob = new Blob([text], {type:mime}), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function csvCell(v){
  var s = (v==null) ? '' : String(v);
  if(/^[=+\-@]/.test(s) && !/^[+\-]?[0-9][0-9 .,()\-]*$/.test(s)) s = "'"+s;   /* Excelで式として動かないように */
  return '"'+s.replace(/"/g,'""')+'"';
}
function toCsv(head, rows){
  return '\ufeff'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',');}).join('\r\n')+'\r\n';
}
function backupLastHtml(){
  var iso = '';
  try{ iso = localStorage.getItem('vh_last_backup') || ''; }catch(_){}
  if(!iso) return '<br><b>まだ、バックアップを保存していません。</b>';
  var days = Math.floor((Date.now()-Date.parse(iso))/86400000);
  var d = new Date(iso);
  return '<br>前回のバックアップ：'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+(days<=0?'今日':days+'日前')+'）'+(days>=30?'　<b>そろそろ、保存しましょう。</b>':'');
}

/* ---------- karte photos (カルテの写真) ---------- */
var PHOTO_BUCKET = 'karte-photos';
function photoErr(e){
  var m = String((e && (e.message||e.error)) || '');
  if(/decode/i.test(m)) return 'この形式の写真は読み込めません';
  if(/Bucket not found/i.test(m)) return '写真の保管場所が、まだ作られていません。SQLをもう一度実行してください';
  if(/row-level security|permission|not allowed|403|401|JWT/i.test(m)) return '権限がありません。ログインし直してください';
  if(/exceed|too large|413/i.test(m)) return 'ファイルが大きすぎます';
  if(/relation .* does not exist|customer_photos/i.test(m)) return '写真の設定が済んでいません。SQLをもう一度実行してください';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return '通信に失敗しました';
  return '時間をおいて、もう一度お試しください';
}
async function loadPhotos(cid){
  state.photoState[cid] = {status:'loading', at:Date.now()};
  try{
    var rows = await fetchAll('customer_photos', function(q){return q.eq('customer_id',cid).order('taken_on',{ascending:false}).order('created_at',{ascending:false});});
    var urls = {};
    if(rows.length){
      var r = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(rows.map(function(x){return x.path;}), 3600);
      if(r.error) throw r.error;
      (r.data||[]).forEach(function(u){ if(u && u.signedUrl) urls[u.path] = u.signedUrl; });
    }
    state.photos[cid] = rows.map(function(x){return {id:x.id, path:x.path, date:x.taken_on, note:x.note||'', url:urls[x.path]||''};});
    state.photoState[cid] = {status:'ok', at:Date.now()};
  }catch(e){
    state.photoState[cid] = {status:'error', at:Date.now(), msg:photoErr(e)};
  }
  render();
}
function intakeHtml(cid){

function resizeImage(file, max, quality){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, hh = img.naturalHeight, k = Math.min(1, max/Math.max(w,hh));
        var cw = Math.max(1, Math.round(w*k)), ch = Math.max(1, Math.round(hh*k));
        var c = document.createElement('canvas'); c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img, 0, 0, cw, ch);
        c.toBlob(function(b){ URL.revokeObjectURL(url); if(b) resolve(b); else reject(new Error('encode failed')); }, 'image/jpeg', quality);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}
async function uploadPhoto(cid, file){
  var blob = await resizeImage(file, 1600, 0.85);
  var id = newId(), path = cid+'/'+id+'.jpg';
  var up = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(up.error) throw up.error;
  var ins = await sb.from('customer_photos').insert({id:id, customer_id:cid, path:path, taken_on:today(), note:''});
  if(ins.error){
    try{ await sb.storage.from(PHOTO_BUCKET).remove([path]); }catch(_){}
    throw ins.error;
  }
  return id;
}

/* ---------- drag to move a reservation ---------- */
/* 予約枠の間隔（10分か15分）ごとに、時間と担当（列）を動かせます。パソコン：そのままドラッグ / スマホ：枠を長押ししてから動かす */
function calcMove(origStart, dur, steps, gs, ge, unit){
  var u = unit || 15;
  var ns = origStart + steps*u;
  var maxStart = gs + Math.floor((ge - dur - gs)/u)*u;
  return Math.max(gs, Math.min(ns, Math.max(gs, maxStart)));
}
async function commitMove(r, t){
  var f = {date:r.date, start:toTime(t.start), dur:Number(r.dur)||30, staffId:t.staffId};
  var a = t.start, b = a + f.dur;
  var isBlock = r.kind==='block';
  var clash = state.rows.concat(state.blocks).filter(function(x){
    if(x.id===r.id || x.date!==f.date || x.staffId!==f.staffId || x.status==='canceled') return false;
    var xa = toMin(x.start), xb = xa + (Number(x.dur)||0);
    return a<xb && xa<b;
  })[0];
  if(clash){
    var ca = toMin(clash.start);
    toast(staffName(f.staffId)+'は'+toTime(ca)+'〜'+toTime(ca+(Number(clash.dur)||0))+'に'+(clash.kind==='block' ? '「'+clash.name+'」の枠が' : clash.name+'様の予約が')+'あるため、移動できません。');
    render(); return false;
  }
  var w = isBlock ? '' : shiftWarning(f);
  if(w && !window.confirm(w+'\nこのまま移動しますか？')){ render(); return false; }
  moveBusy = true;
  try{
    if(isBlock) await saveBlock(r.id, {date:r.date, start:f.start, dur:f.dur, staffId:f.staffId, name:r.name});
    else await saveRow(r.id, Object.assign({}, r, {start:f.start, staffId:f.staffId}));
    toast((isBlock ? '「'+r.name+'」' : r.name+'様')+'を '+toTime(a)+'〜'+toTime(b)+' に移動しました');
    return true;
  }catch(e){
    toast(errMsg(e)); render(); return false;
  }finally{ moveBusy = false; }
}
var moveBusy = false, dragSuppress = false;
(function(){
  var LONG_MS = 300, MOVE_PX = 6;
  var press = null, timer = null, autoTimer = null, last = {x:0, y:0};

  function stopTimers(){
    if(timer){ clearTimeout(timer); timer = null; }
    if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  }
  function clearMarks(){
    document.body.classList.remove('is-dragging');
    Array.prototype.forEach.call(document.querySelectorAll('.scol.dropcol'), function(c){ c.classList.remove('dropcol'); });
  }
  function cancelPress(redraw){
    var p = press;
    stopTimers(); press = null; dragState = null; clearMarks();
    if(p && p.active){
      try{ p.blk.releasePointerCapture(p.pid); }catch(_){}
      render();
    } else if(pendingRender){ render(); }
  }
  function colAt(x){
    var best = null, bd = 1e9;
    Array.prototype.forEach.call(document.querySelectorAll('.ledger .scol'), function(c){
      var r = c.getBoundingClientRect();
      var d = x<r.left ? r.left-x : x>r.right ? x-r.right : 0;
      if(d<bd){ bd = d; best = c; }
    });
    return best;
  }
  function activate(){
    var p = press;
    if(!p) return;
    if(!document.body.contains(p.blk)){ cancelPress(); return; }
    p.active = true; dragState = p;
    p.blk.classList.add('dragging');
    document.body.classList.add('is-dragging');
    try{ p.blk.setPointerCapture(p.pid); }catch(_){}
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
    autoTimer = setInterval(autoScroll, 30);
    preview();
  }
  function preview(){
    var p = press;
    if(!p || !p.active) return;
    var dy = (last.y - p.y0) + (p.sc.scrollTop - p.st0);
    var u = snapMin();
    var gs = state.gs, ge = gs + Math.round(p.col.offsetHeight/PXM);
    var dur = Number(p.r.dur)||30;
    var ns = calcMove(p.orig, dur, Math.round(dy/snapPx()), gs, ge, u);
    var tc = colAt(last.x) || p.col;
    if(tc.dataset.staff==='__unknown') tc = p.col;
    var dx = tc.getBoundingClientRect().left - p.col.getBoundingClientRect().left;
    p.blk.style.transform = 'translate('+dx+'px,'+((ns-p.orig)*PXM)+'px)';
    var bt = p.blk.querySelector('.bt');
    if(bt) bt.textContent = toTime(ns)+'〜'+toTime(ns+dur);
    Array.prototype.forEach.call(document.querySelectorAll('.scol.dropcol'), function(c){ c.classList.remove('dropcol'); });
    tc.classList.add('dropcol');
    p.target = {start:ns, staffId:tc.dataset.staff};
  }
  function autoScroll(){
    var p = press;
    if(!p || !p.active) return;
    var r = p.sc.getBoundingClientRect(), dy = 0, dx = 0;
    if(last.y < r.top+90) dy = -12; else if(last.y > r.bottom-48) dy = 12;
    if(last.x < r.left+90) dx = -12; else if(last.x > r.right-48) dx = 12;
    if(!dy && !dx) return;
    var t0 = p.sc.scrollTop, l0 = p.sc.scrollLeft;
    p.sc.scrollTop += dy; p.sc.scrollLeft += dx;
    if(p.sc.scrollTop!==t0 || p.sc.scrollLeft!==l0) preview();
  }

  document.addEventListener('pointerdown', function(e){
    dragSuppress = false;   /* 新しい操作が始まったら、前のドラッグの「クリック無効」は終わり */
    if(moveBusy || state.view!=='ledger' || state.auth!=='in') return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(press) cancelPress();   /* 前の操作が残っていたら、いったん捨てる */
    var blk = e.target && e.target.closest ? e.target.closest('.blk') : null;
    if(!blk) return;
    var isBlock = blk.dataset.kind==='block';
    var r = (isBlock ? state.blocks : state.rows).filter(function(x){return x.id===blk.dataset.id;})[0];
    var sc = blk.closest('.ledger-scroll'), col = blk.closest('.scol');
    if(!r || (!isBlock && r.status!=='booked') || !sc || !col) return;
    press = {blk:blk, r:r, sc:sc, col:col, pid:e.pointerId, type:e.pointerType,
             x0:e.clientX, y0:e.clientY, st0:sc.scrollTop, orig:toMin(r.start), active:false, target:null};
    last.x = e.clientX; last.y = e.clientY;
    if(e.pointerType==='touch') timer = setTimeout(activate, LONG_MS);
  });
  document.addEventListener('pointermove', function(e){
    if(!press || e.pointerId!==press.pid) return;
    last.x = e.clientX; last.y = e.clientY;
    if(!press.active){
      var moved = Math.abs(e.clientX-press.x0)>MOVE_PX || Math.abs(e.clientY-press.y0)>MOVE_PX;
      if(!moved) return;
      if(press.type==='touch'){ cancelPress(); return; }
      activate();
      if(!press || !press.active) return;
    }
    if(e.cancelable) e.preventDefault();
    preview();
  });
  document.addEventListener('pointerup', function(e){
    if(!press || e.pointerId!==press.pid) return;
    var p = press;
    if(!p.active){ cancelPress(); return; }
    if(e.cancelable) e.preventDefault();
    dragSuppress = true; setTimeout(function(){ dragSuppress = false; }, 400);
    var t = p.target, r = p.r;
    stopTimers(); press = null; dragState = null; clearMarks();
    try{ p.blk.releasePointerCapture(p.pid); }catch(_){}
    if(!t || (t.start===p.orig && t.staffId===r.staffId)){ render(); return; }
    commitMove(r, {start:t.start, staffId:t.staffId});
  });
  document.addEventListener('pointercancel', function(e){
    if(press && e.pointerId===press.pid) cancelPress();
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && press && press.active){ dragSuppress = true; setTimeout(function(){ dragSuppress = false; }, 400); cancelPress(); }
  });
  /* 長押しのあいだに画面が動かないように */
  document.addEventListener('touchmove', function(e){ if(dragState && e.cancelable) e.preventDefault(); }, {passive:false});
  document.addEventListener('contextmenu', function(e){ if(press) e.preventDefault(); });
  /* ドラッグしたあとに、枠が「開く」動きをしないように */
  document.addEventListener('click', function(e){
    if(dragSuppress){ dragSuppress = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

/* ---------- drag on an empty area to fill a time (休憩などの枠) ---------- */
/* パソコン：空いているところをドラッグ / スマホ：空いているところを長押ししてから動かす */
(function(){
  var LONG_MS = 350, MOVE_PX = 6;
  var sel = null, timer = null, autoTimer = null, last = {x:0, y:0};
  function stop(){
    if(timer){ clearTimeout(timer); timer = null; }
    if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  }
  function cancel(){
    var p = sel;
    stop(); sel = null; if(dragState===p) dragState = null;
    document.body.classList.remove('is-dragging');
    if(p && p.box && p.box.parentNode) p.box.parentNode.removeChild(p.box);
    if(p && p.active){ try{ p.col.releasePointerCapture(p.pid); }catch(_){} }
    if(pendingRender) render();
  }
  function rowAt(y){
    var r = sel.col.getBoundingClientRect();
    var n = Math.round(sel.col.offsetHeight/snapPx());
    return Math.max(0, Math.min(n-1, Math.floor((y - r.top)/snapPx())));
  }
  function range(){
    var a = rowAt(sel.y0abs - (sel.sc.scrollTop - sel.st0)), b = rowAt(last.y);
    var lo = Math.min(a,b), hi = Math.max(a,b);
    var u = snapMin();
    return {start:state.gs + lo*u, end:state.gs + (hi+1)*u};
  }
  function draw(){
    if(!sel || !sel.active) return;
    var r = range();
    sel.range = r;
    sel.box.style.top = ((r.start-state.gs)*PXM)+'px';
    sel.box.style.height = ((r.end-r.start)*PXM - 2)+'px';
    sel.box.textContent = toTime(r.start)+'〜'+toTime(r.end);
  }
  function activate(){
    if(!sel) return;
    if(!document.body.contains(sel.col)){ cancel(); return; }
    sel.active = true; dragState = sel;
    var box = document.createElement('div'); box.className = 'selbox'; sel.box = box;
    sel.col.appendChild(box);
    document.body.classList.add('is-dragging');
    try{ sel.col.setPointerCapture(sel.pid); }catch(_){}
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
    autoTimer = setInterval(function(){
      if(!sel || !sel.active) return;
      var r = sel.sc.getBoundingClientRect(), dy = 0;
      if(last.y < r.top+90) dy = -12; else if(last.y > r.bottom-48) dy = 12;
      if(!dy) return;
      var t0 = sel.sc.scrollTop; sel.sc.scrollTop += dy;
      if(sel.sc.scrollTop!==t0) draw();
    }, 30);
    draw();
  }
  document.addEventListener('pointerdown', function(e){
    if(moveBusy || state.view!=='ledger' || state.auth!=='in') return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(!e.target || !e.target.closest || e.target.closest('.blk')) return;
    var col = e.target.closest('.scol');
    if(!col || col.dataset.staff==='__unknown') return;
    var sc = col.closest('.ledger-scroll'); if(!sc) return;
    if(sel) cancel();
    sel = {col:col, sc:sc, pid:e.pointerId, type:e.pointerType, x0:e.clientX, y0abs:e.clientY, st0:sc.scrollTop, active:false, box:null, range:null};
    last.x = e.clientX; last.y = e.clientY;
    if(e.pointerType==='touch') timer = setTimeout(activate, LONG_MS);
  });
  document.addEventListener('pointermove', function(e){
    if(!sel || e.pointerId!==sel.pid) return;
    last.x = e.clientX; last.y = e.clientY;
    if(!sel.active){
      var moved = Math.abs(e.clientX-sel.x0)>MOVE_PX || Math.abs(e.clientY-sel.y0abs)>MOVE_PX;
      if(!moved) return;
      if(sel.type==='touch'){ cancel(); return; }   /* 長押しの前に動かしたら、画面のスクロール */
      activate();
      if(!sel || !sel.active) return;
    }
    if(e.cancelable) e.preventDefault();
    draw();
  });
  document.addEventListener('pointerup', function(e){
    if(!sel || e.pointerId!==sel.pid) return;
    var p = sel;
    if(!p.active){ cancel(); return; }   /* ただのタップ：今までどおり、予約の登録画面が開く */
    if(e.cancelable) e.preventDefault();
    dragSuppress = true; setTimeout(function(){ dragSuppress = false; }, 400);
    var r = p.range, staffId = p.col.dataset.staff;
    cancel();
    if(!r) return;
    var s = state.settings;
    var a = Math.max(r.start, s.open*60), b = Math.min(r.end, s.close*60);
    if(b - a < 15){ a = r.start; b = r.end; }
    openBlockForm({date:state.date, staffId:staffId, start:a, end:b, fromSel:true});
  });
  document.addEventListener('pointercancel', function(e){ if(sel && e.pointerId===sel.pid) cancel(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && sel && sel.active){ dragSuppress = true; setTimeout(function(){ dragSuppress = false; }, 400); cancel(); }
  });
  document.addEventListener('contextmenu', function(e){ if(sel) e.preventDefault(); });
})();

      ? '初期設定のSQL（supabase-setup.sql）が、まだ実行されていないようです。手順書のステップ2を確かめてください。'
      : '読み込めませんでした。通信の状態を確かめて、もう一度お試しください。';
    state.auth = 'error'; render(); return;
  }
  state.auth = 'in'; state.needScroll = true;
  render();
  startRealtime();
}
document.addEventListener('submit', function(e){
  if(e.target.id==='loginForm'){ e.preventDefault(); doLogin(); }
});
async function boot(){
  if(!(CFG.SUPABASE_URL && CFG.SUPABASE_KEY && /^https?:\/\//.test(CFG.SUPABASE_URL)) || !window.supabase){
    state.auth = 'setup'; render(); return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
  sb.auth.onAuthStateChange(function(ev){
    if(ev==='SIGNED_OUT' && state.auth==='in') location.reload();
  });
  render();
  var r = await sb.auth.getSession();
  if(r.data && r.data.session){ state.email = (r.data.session.user && r.data.session.user.email) || ''; await enter(); }
  else { state.auth = 'out'; render(); }
}
boot();
})();
</script>
</body>
</html>
